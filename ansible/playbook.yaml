  hosts: query
  become: true

  tasks:
- name: Configure vmagent on query server
  hosts: query
  become: true

  tasks:

    - name: Download vmutils archive
      ansible.builtin.get_url:
        url: https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.155.0/vmutils-linux-amd64-v1.155.0.tar.gz
        dest: /tmp/vmutils.tar.gz
        mode: "0644"

    - name: Extract vmutils binaries
      ansible.builtin.unarchive:
        src: /tmp/vmutils.tar.gz
        dest: /usr/local/bin
        remote_src: true


    - name: Verify vmagent binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/vmagent-prod
      register: vmagent_binary

    - name: Stop if vmagent binary is missing
      ansible.builtin.fail:
        msg: "vmagent-prod binary archive mein nahi mili."
      when: not vmagent_binary.stat.exists

    - name: Create vmagent configuration directory
      ansible.builtin.file:
        path: /etc/vmagent
        state: directory
        mode: "0755"

    - name: Configure metrics scraping
      ansible.builtin.copy:
        dest: /etc/vmagent/scrape.yml
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: node
              static_configs:
                - targets:
                    - 10.0.1.35:9100
                    - 10.0.1.171:9100
                    - 10.0.1.249:9100
                    - 10.0.1.110:9100

    - name: Configure vmagent service
      ansible.builtin.copy:
        dest: /etc/systemd/system/vmagent.service
        mode: "0644"
        content: |
          [Unit]
          Description=VictoriaMetrics Agent
          After=network.target

          [Service]
          ExecStart=/usr/local/bin/vmagent-prod -promscrape.config=/etc/vmagent/scrape.yml -remoteWrite.url=http://10.0.1.171:8480/insert/0/prometheus/api/v1/write
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Start vmagent
      ansible.builtin.systemd:
        name: vmagent
        daemon_reload: true
        enabled: true
        state: restarted

